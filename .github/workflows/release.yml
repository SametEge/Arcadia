name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0) — must already exist'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm test

      - name: Build installer
        # Uploading is done below, so the release gets its notes and checksums
        # in one go; electron-builder still writes latest.yml for the updater.
        run: npx electron-builder --win nsis --publish never

      - name: Collect release files
        shell: bash
        run: |
          mkdir release
          cp dist/Arcadia-Setup-*.exe dist/Arcadia-Setup-*.exe.blockmap dist/latest.yml release/
          node build/sha256sums.js release/*.exe > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Release notes
        run: node build/release-notes.js ${{ steps.version.outputs.version }} > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Arcadia v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: release/*
          fail_on_unmatched_files: true

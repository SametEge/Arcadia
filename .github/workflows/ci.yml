name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'store/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # The headless tests stub Electron out; no need for the ~100 MB binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check syntax
        run: |
          for f in main.js preload.js $(git ls-files 'src/*.js' 'renderer/*.js' 'build/*.js'); do
            node --check "$f"
          done

      - run: npm test

  package:
    name: Windows installer
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: Arcadia-Setup-${{ github.sha }}
          path: |
            dist/Arcadia-Setup-*.exe
            dist/latest.yml
          retention-days: 14
